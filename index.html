<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="author" content="Maiza Volpato dos Santos" />
    <meta name="keywords" content="" />

    <title>Around</title>
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="./images/logo.png" alt="Logo Around" class="header__logo" />
      </header>
      <section class="profile">
        <img
          src="./images/avatar.png"
          alt="Profile Image"
          class="profile__image"
        />
        <div class="profile__info">
          <div class="profile__name-button">
            <h2 class="profile__name">Jacques Cousteau</h2>
            <button class="profile__edit-button"></button>
          </div>
          <h1 class="profile__job">Explorador</h1>
        </div>
        <button class="profile__add-image-button"></button>
      </section>
      <section class="elements"></section>
      <footer class="footer">&copy; Maiza Volpato dos Santos</footer>
    </div>
    <section class="form-profile">
      <div class="form-profile__container">
        <button class="form-profile__button-close" type="button"></button>
        <h2 class="form-profile__title">Editar perfil</h2>
        <form class="popup__form form-profile__edit" novalidate>
          <fieldset class="form-profile__fieldset">
            <input
              type="text"
              class="popup__input form-profile__input"
              id="name"
              name="name"
              placeholder="Name"
              required
              minlength="2"
              maxlength="40"
            />
            <span id="name-error" class="form__input-error-message">Error</span>

            <input
              type="text"
              class="popup__input form-profile__input"
              id="detail"
              name="detail"
              placeholder="Detail"
              required
              minlength="2"
              maxlength="40"
            />
            <span id="detail-error" class="form__input-error-message"
              >Error</span
            >
            <button
              class="popup__button form-profile__button-submit"
              type="submit"
            >
              Salvar
            </button>
          </fieldset>
        </form>
      </div>
    </section>

    <section class="form-elements">
      <div class="form-elements__container">
        <button class="form-elements__button-close" type="button"></button>
        <h2 class="form-elements__title">Novo local</h2>
        <form class="popup__form form-elements__edit" novalidate>
          <fieldset class="form-elements__fieldset">
            <input
              type="text"
              class="popup__input form-elements__input"
              id="title"
              name="title"
              placeholder="Título"
              minlength="2"
              maxlength="30"
              required
            />
            <span id="title-error" class="form__input-error-message"
              >Error</span
            >
            <input
              type="url"
              class="popup__input form-elements__input"
              id="image"
              name="image"
              placeholder="Link de Imagem"
              required
            />
            <span id="image-error" class="form__input-error-message"
              >Error</span
            >
            <button
              class="popup__button form-elements__button-submit"
              type="submit"
            >
              Salvar
            </button>
          </fieldset>
        </form>
      </div>
    </section>
    <div class="image-popup">
      <div class="image-popup__container">
        <button class="image-popup__button-close" type="button"></button>
        <img src="" alt="" class="image-popup__image" />
        <span class="image-popup__title"></span>
      </div>
    </div>
    <template id="elements-template">
      <div class="element">
        <button class="element__remove-button"></button>
        <div class="element__card">
          <img src="" alt="" class="element__image" />
          <div class="element__card-block">
            <div class="element__card-text"></div>
            <button class="element__card-button-like"></button>
          </div>
        </div>
      </div>
    </template>
    <script src="./scripts/index.js" type="module"></script>
    <script src="./scripts/validate.js" type="module"></script>
  </body>
</html>
